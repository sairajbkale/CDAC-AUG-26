<!DOCTYPE html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <h2 id="login-text">Login</h2>
        <form action="directory.html" method="get">
            <div>
            <input type="text" placeholder="Enter Name" class="login-ip">
            </div>
            <div>
            <input type="password" placeholder="Enter Password" class="login-ip">
            </div>
            <div>
            <button type="submit" id="login-btn">Submit</button>
            </div>
            <div>
                <p id="help-text">Need An Account ? <a href="onboarding.html">Sign Up</a></p>
            </div>
        </form>
    </div>
</body>
</html>
